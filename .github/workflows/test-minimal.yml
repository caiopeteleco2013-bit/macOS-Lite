name: Build macOS-Lite ISO (minimal test)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends live-build debootstrap 2>&1 || echo "INSTALL FAILED"

      - name: Check live-build
        run: |
          which lb || echo "lb not found"
          lb --version 2>&1 || echo "lb version failed"
