name: Build macOS-Lite ISO (minimal test)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnostics
        run: |
          echo "=== OS ==="
          cat /etc/os-release
          echo "=== apt sources ==="
          cat /etc/apt/sources.list
          ls -la /etc/apt/sources.list.d/
          echo "=== apt update ==="
          apt-get update 2>&1 || echo "APT UPDATE FAILED"
          echo "=== apt search live-build ==="
          apt-cache search live-build 2>&1 || echo "APT CACHE SEARCH FAILED"
          echo "=== apt search debootstrap ==="
          apt-cache search debootstrap 2>&1 || echo "APT CACHE SEARCH FAILED"
