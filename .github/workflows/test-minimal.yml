name: Build macOS-Lite ISO (network test)

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test curl to Debian
        run: |
          echo "=== curl deb.debian.org ==="
          curl -sI --max-time 10 http://deb.debian.org/debian/dists/bookworm/Release 2>&1 || echo "CURL DEBIAN FAILED"
          echo "=== curl ubuntu ==="
          curl -sI --max-time 10 http://archive.ubuntu.com/ubuntu/dists/noble/Release 2>&1 || echo "CURL UBUNTU FAILED"
