name: Build macOS-Lite ISO (apt test)

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test apt-get update
        run: |
          echo "=== apt-get update ==="
          apt-get update
          echo "UPDATE_EXIT_CODE: $?"

      - name: Test wget
        run: |
          echo "=== wget test ==="
          wget -q --spider http://archive.ubuntu.com/ubuntu/dists/noble/Release
          echo "WGET_EXIT_CODE: $?"
