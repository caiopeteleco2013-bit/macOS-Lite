name: Build macOS-Lite ISO (debootstrap test)

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install debootstrap
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends debootstrap 2>&1 || echo "DEBOOTSTRAP INSTALL FAILED"
          which debootstrap || echo "debootstrap not found"
          debootstrap --version 2>&1 || echo "debootstrap version failed"
