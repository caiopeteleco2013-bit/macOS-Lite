name: Build macOS-Lite ISO

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [ default, nonfree-firmware ]

    container:
      image: debian:bookworm
      options: >-
        --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            debootstrap curl dpkg grub-pc grub-efi-amd64 grub-mkrescue \
            xorriso mksquashfs mtools wget gpg

      - name: Build ISO
        run: |
          chmod +x scripts/build-iso.sh
          ./scripts/build-iso.sh "${{ matrix.variant }}"

      - name: Upload ISO artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-lite-${{ matrix.variant }}-amd64
          path: |
            build/image/*.iso
            build/image/*.sha256
