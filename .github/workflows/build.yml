name: Build macOS-Lite ISO

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      variant:
        description: 'ISO variant'
        required: false
        default: 'default'
        type: choice
        options:
          - default
          - nonfree-firmware

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [ default, nonfree-firmware ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build ISO
        id: build
        run: |
          chmod +x scripts/build-iso.sh
          ./scripts/build-iso.sh "${{ matrix.variant }}"

      - name: Debug info
        if: always()
        run: |
          echo "=== build/image contents ==="
          ls -laR build/image/ 2>/dev/null || echo "build/image/ does not exist"
          echo "=== build.log tail ==="
          tail -100 build/image/build.log 2>/dev/null || echo "no build.log"

      - name: Upload ISO artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: macos-lite-${{ matrix.variant }}-amd64
          path: |
            build/image/*.iso
            build/image/*.sha256
            build/image/build.log
