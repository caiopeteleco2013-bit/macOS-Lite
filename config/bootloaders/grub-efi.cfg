# macOS-Lite GRUB (UEFI) bootloader config snippet
set default="0"
set timeout=5
set gfxmode=auto
set gfxpayload=keep
load_video
insmod gfxterm
insmod png
if background_image /boot/grub/macos-lite-bg.png; then
  set color_normal=white/black
  set color_highlight=black/light-gray
fi

menuentry "macOS-Lite (live)" {
    set gfxpayload=keep
    linux   /live/vmlinuz boot=live components quiet splash
    initrd  /live/initrd.img
}

menuentry "macOS-Lite (live, safe graphics)" {
    set gfxpayload=keep
    linux   /live/vmlinuz boot=live components quiet splash nomodeset
    initrd  /live/initrd.img
}

menuentry "macOS-Lite (install to disk)" {
    set gfxpayload=keep
    linux   /live/vmlinuz boot=live components quiet splash installer
    initrd  /live/initrd.img
}

menuentry "Shut down" {
    halt
}
menuentry "Restart" {
    reboot
}
